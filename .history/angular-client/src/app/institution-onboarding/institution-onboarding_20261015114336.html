<section class="onboarding-container">
  <header class="onboarding-header">
    <h1 class="onboarding-title">Institution Onboarding</h1>
    <p class="onboarding-subtitle">
      Select your institution type to begin the Onboarding process
    </p>
  </header>

  <div class="onboarding-divider"></div>

  <!-- Options
   1. Basic Education (Primary/Secondary)
   2. TVET (Polythnics)
   3. Higher education (Universities/Colleges) -->
  <div class="onboarding-options">
    <label
      class="onboarding-card"
      *ngFor="let option of institutionTypes"
      [class.selected]="selectedType === option.value"
    >
      <input
        type="radio"
        name="institutionType"
        class="onboarding-radio-input"
        [value]="option.value"
        [(ngModel)]="selectedType"
      />

      <div class="onboarding-card-icon">
        <i class="bi" [ngClass]="option.icon"></i>
      </div>

      <div class="onboarding-card-text">
        <h3 class="onboarding-card-title">{{ option.label }}</h3>
        <p class="onboarding-card-desc">{{ option.description }}</p>
      </div>

      <div class="onboarding-card-radio">
        <span class="radio-circle" [class.checked]="selectedType === option.value"></span>
      </div>
    </label>
  </div>

  <!-- Proceed Button -->
  <div class="onboarding-actions">
    <button
      class="onboarding-proceed-btn"
      [disabled]="!selectedType"
      (click)="proceed()"
    >
      Proceed to Institution Onboarding
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</section>

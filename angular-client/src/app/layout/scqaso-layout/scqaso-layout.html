<div class="dashboard-wrapper">

  <!-- ========================================== -->
  <!-- SIDEBAR                                    -->
  <!-- ========================================== -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../../../assets/kemis-logo-big.png" alt="Kemis Logo" class="logo-img">
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" routerLink="/scqaso/sub-county-quality-assurance" routerLinkActive="active">
        <i class="bi bi-grid-fill"></i>
        <span>Dashboard</span>
      </a>

      <a class="nav-item">
        <i class="bi bi-search"></i>
        <span>Menu Search</span>
      </a>

      <div class="nav-parent has-children">
        <a class="nav-item">
          <i class="bi bi-clipboard-check"></i>
          <span>KEMIS Reports</span>
        </a>
        <ul class="nav-children">
         <li><a routerLink="inspected-schools" routerLinkActive="active">Inspected Schools</a></li>
        </ul>
      </div>

      <div class="nav-parent has-children">
        <a class="nav-item">
          <i class="bi bi-pencil-square"></i>
          <span>Institution Registration</span>
        </a>
        <ul class="nav-children">
          <li><a routerLink="pending-inspections" routerLinkActive="active">Pending Inspections</a></li>
        </ul>
      </div>

      <a class="nav-item text-danger mt-4">
        <i class="bi bi-book"></i>
        <span>Escalations</span>
      </a>

      <a class="nav-item text-danger mt-4">
        <i class="bi bi-book"></i>
        <span>User Manual</span>
      </a>
    </nav>
  </aside>

  <!-- ========================================== -->
  <!-- MAIN CONTENT AREA                          -->
  <!-- ========================================== -->
  <main class="main-content">

    <!-- Top Header -->
    <header class="top-header">
      <div class="header-right">
        <select class="form-select header-select" [value]="selectedLevel">
          <option value="Primary School">Primary School</option>
          <option value="Junior School">Junior School</option>
        </select>

        <div class="user-profile ms-3">
          <div class="avatar">
            <i class="bi bi-person-fill"></i>
          </div>
          <div class="user-info">
            <span class="name" style="text-transform: uppercase">{{ dashboardData.subCountyName }} SCQASO</span>
            <span class="role">{{ dashboardData.userRole }}</span>
          </div>
        </div>
        <button class="logout-btn" (click)="logout()">
          <i class="bi bi-power"></i>
        </button>
      </div>
    </header>

    <!-- PAGE CONTENT (This is where the dashboard loads) -->
    <div class="page-content-wrapper">
      <router-outlet></router-outlet>
    </div>

  </main>
</div>
